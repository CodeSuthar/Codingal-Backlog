<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Quiz App</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: 'Poppins', sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#667eea,#764ba2);
      overflow:hidden;
    }

    .quiz-container{
      width:90%;
      max-width:650px;
      background:white;
      padding:30px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
      animation:fadeIn 1s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    h1{
      text-align:center;
      margin-bottom:20px;
      color:#444;
    }

    .top-bar{
      display:flex;
      justify-content:space-between;
      margin-bottom:20px;
      font-weight:bold;
      color:#555;
    }

    #question{
      font-size:24px;
      margin-bottom:25px;
      color:#222;
      min-height:70px;
    }

    .option{
      background:#f5f5f5;
      padding:15px;
      margin:12px 0;
      border-radius:12px;
      cursor:pointer;
      transition:0.3s;
      border:2px solid transparent;
      font-size:16px;
    }

    .option:hover{
      transform:scale(1.03);
      background:#ececec;
    }

    .selected{
      background:#667eea;
      color:white;
      border:2px solid #4d63d8;
    }

    .correct{
      background:#4caf50 !important;
      color:white;
    }

    .wrong{
      background:#f44336 !important;
      color:white;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#ff6b6b;
      color:white;
      font-size:18px;
      cursor:pointer;
      margin-top:20px;
      transition:0.3s;
    }

    button:hover{
      background:#ff4f4f;
      transform:scale(1.02);
    }

    #result{
      margin-top:20px;
      text-align:center;
      font-size:20px;
      font-weight:bold;
    }

    .hide{
      display:none;
    }

    .progress-bar{
      width:100%;
      height:12px;
      background:#ddd;
      border-radius:10px;
      overflow:hidden;
      margin-bottom:20px;
    }

    .progress{
      height:100%;
      width:0%;
      background:linear-gradient(90deg,#00c6ff,#0072ff);
      transition:0.5s;
    }

    .final-score{
      text-align:center;
      animation:pop 0.5s ease;
    }

    @keyframes pop{
      0%{
        transform:scale(0.7);
        opacity:0;
      }
      100%{
        transform:scale(1);
        opacity:1;
      }
    }

    .emoji{
      font-size:60px;
      margin-bottom:15px;
    }

  </style>
</head>

<body>

  <div class="quiz-container">

    <h1>🎯 Interactive Quiz App</h1>

    <div class="top-bar">
      <div>Score: <span id="score">0</span></div>
      <div>Question: <span id="qNum">1</span>/5</div>
      <div>⏳ <span id="timer">15</span>s</div>
    </div>

    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>

    <div id="quiz-box">

      <div id="question"></div>

      <div id="options"></div>

      <button id="submitBtn">Submit Answer</button>

      <div id="result"></div>

    </div>

    <button id="restartBtn" class="hide">🔄 Restart Quiz</button>

  </div>

  <script>

    const quizData = [

      {
        question:"Which language is used for web styling?",
        options:["HTML","CSS","Python","Java"],
        answer:"CSS"
      },

      {
        question:"Which method selects an element by ID?",
        options:["querySelector()","getElementById()","getElements()","selectId()"],
        answer:"getElementById()"
      },

      {
        question:"What does HTML stand for?",
        options:[
          "Hyper Text Markup Language",
          "HighText Machine Language",
          "Hyperlinks Text Mark",
          "Home Tool Markup Language"
        ],
        answer:"Hyper Text Markup Language"
      },

      {
        question:"Which company created JavaScript?",
        options:["Google","Apple","Netscape","Microsoft"],
        answer:"Netscape"
      },

      {
        question:"Which symbol is used for comments in JavaScript?",
        options:["//","#","<!-- -->","**"],
        answer:"//"
      }

    ];

    let currentQuestion = 0;
    let score = 0;
    let selectedOption = null;
    let timer = 15;
    let timerInterval;

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const submitBtn = document.getElementById("submitBtn");
    const resultEl = document.getElementById("result");
    const restartBtn = document.getElementById("restartBtn");
    const scoreEl = document.getElementById("score");
    const qNumEl = document.getElementById("qNum");
    const timerEl = document.getElementById("timer");
    const progressEl = document.getElementById("progress");

    function startTimer(){

      timer = 15;
      timerEl.innerText = timer;

      clearInterval(timerInterval);

      timerInterval = setInterval(() => {

        timer--;
        timerEl.innerText = timer;

        if(timer <= 0){
          clearInterval(timerInterval);
          autoNext();
        }

      },1000);
    }

    function loadQuestion(){

      resultEl.innerHTML = "";
      selectedOption = null;

      qNumEl.innerText = currentQuestion + 1;

      progressEl.style.width =
        ((currentQuestion)/quizData.length)*100 + "%";

      const currentQuiz = quizData[currentQuestion];

      questionEl.innerText = currentQuiz.question;

      optionsEl.innerHTML = "";

      currentQuiz.options.forEach(option => {

        const div = document.createElement("div");

        div.classList.add("option");
        div.innerText = option;

        div.addEventListener("click", () => {

          document.querySelectorAll(".option").forEach(opt=>{
            opt.classList.remove("selected");
          });

          div.classList.add("selected");
          selectedOption = option;
        });

        optionsEl.appendChild(div);

      });

      startTimer();
    }

    submitBtn.addEventListener("click", checkAnswer);

    function checkAnswer(){

      if(selectedOption === null){

        resultEl.style.color = "red";
        resultEl.innerText = "⚠ Please select an answer!";
        return;
      }

      clearInterval(timerInterval);

      const correctAnswer = quizData[currentQuestion].answer;

      const options = document.querySelectorAll(".option");

      options.forEach(option => {

        if(option.innerText === correctAnswer){
          option.classList.add("correct");
        }

        if(
          option.innerText === selectedOption &&
          selectedOption !== correctAnswer
        ){
          option.classList.add("wrong");
        }

      });

      if(selectedOption === correctAnswer){

        score++;
        scoreEl.innerText = score;

        resultEl.style.color = "green";
        resultEl.innerText = "✅ Correct Answer!";

      }else{

        resultEl.style.color = "red";
        resultEl.innerText =
          `❌ Wrong! Correct Answer: ${correctAnswer}`;
      }

      setTimeout(nextQuestion,1500);
    }

    function autoNext(){

      resultEl.style.color = "orange";
      resultEl.innerText = "⏰ Time's Up!";

      setTimeout(nextQuestion,1000);
    }

    function nextQuestion(){

      currentQuestion++;

      if(currentQuestion < quizData.length){

        loadQuestion();

      }else{

        showFinalScore();
      }
    }

    function showFinalScore(){

      clearInterval(timerInterval);

      progressEl.style.width = "100%";

      let emoji = "😎";

      if(score <= 2){
        emoji = "😅";
      }else if(score === 5){
        emoji = "🏆";
      }

      document.getElementById("quiz-box").innerHTML = `

        <div class="final-score">

          <div class="emoji">${emoji}</div>

          <h2>Quiz Completed!</h2>

          <br>

          <h1>${score} / ${quizData.length}</h1>

          <br>

          <p>
            ${
              score === 5
              ? "Excellent Work!"
              : score >= 3
              ? "Great Job!"
              : "Keep Practicing!"
            }
          </p>

        </div>

      `;

      restartBtn.classList.remove("hide");
    }

    restartBtn.addEventListener("click", () => {

      currentQuestion = 0;
      score = 0;

      scoreEl.innerText = 0;

      restartBtn.classList.add("hide");

      document.getElementById("quiz-box").innerHTML = `

        <div id="question"></div>

        <div id="options"></div>

        <button id="submitBtn">Submit Answer</button>

        <div id="result"></div>

      `;

      location.reload();

    });

    loadQuestion();

  </script>

</body>
</html>
